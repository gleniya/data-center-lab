<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Data Center</title>
<style>
:root{
  --paper:#E9EDF1; --card:#fff; --line:#CBD3DC; --ink:#14233A; --muted:#5A6B80;
  --steel:#2B4C7E; --ok:#1F7A55; --warn:#B7791F; --bad:#B8322A;
  --okbg:#DDF1E8; --warnbg:#F8EBD0; --badbg:#F6DAD7; --rack:#1B2B44;
  --sans:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.45}
header{padding:14px 14px 4px;max-width:600px;margin:0 auto}
h1{font-size:24px;letter-spacing:-.02em;margin:0;line-height:1.1}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
main{max-width:600px;margin:0 auto;padding:10px 14px 96px}
h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.hint{color:var(--muted);font-size:13.5px;margin:8px 0 0}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{background:none;border:0;border-radius:0;color:var(--muted);min-height:54px;font-size:12px;font-weight:700;padding:0 2px;border-top:3px solid transparent}
nav button[aria-current=true]{color:var(--steel);border-top-color:var(--steel)}

/* buttons */
button{font:inherit;font-weight:700;font-size:14.5px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--steel);background:var(--steel);color:#fff;cursor:pointer}
button.alt{background:#fff;color:var(--steel)}
button.danger{background:#fff;color:var(--bad);border-color:var(--bad)}
button.go{background:var(--ok);border-color:var(--ok)}
button.sm{min-height:38px;font-size:13px;padding:0 10px}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7FA6E0;outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
select,input[type=text]{font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
.form{display:flex;gap:8px;flex-wrap:wrap}
.form select{flex:1}

/* rack */
.unit{display:flex;align-items:center;gap:10px;background:var(--rack);color:#E9EDF1;border-radius:6px;padding:10px 12px;margin-bottom:6px;border:1px solid #0F1C30}
.led{width:11px;height:11px;border-radius:50%;background:#5A6B80;flex:none}
.led.on{background:#4ADE80;box-shadow:0 0 6px #4ADE80}
.led.warn{background:#F5B642;box-shadow:0 0 6px #F5B642}
.led.bad{background:#F2635A;box-shadow:0 0 6px #F2635A}
.unit .nm{font-weight:700;font-size:14.5px;min-width:76px}
.unit .os{font-size:12px;color:#9FB0C6}
.unit .meter{flex:1;min-width:0}
.unit .meter div{height:6px;background:#2C4060;border-radius:3px;overflow:hidden;margin-top:4px}
.unit .meter i{display:block;height:100%;background:#7FA6E0}
.unit .pct{font-family:var(--mono);font-size:12px;width:38px;text-align:right}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile b{display:block;font-size:22px;letter-spacing:-.02em;line-height:1.15}
.tile span{font-size:13px;color:var(--muted)}
.tile.warn{background:var(--warnbg);border-color:#E6CB93}.tile.bad{background:var(--badbg);border-color:#E3B1AC}.tile.ok b{color:var(--ok)}
svg.spark{width:100%;height:76px;display:block}

/* alerts */
.al{border-left:6px solid var(--warn);background:var(--warnbg);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.al.bad{border-color:var(--bad);background:var(--badbg)}
.al.good{border-color:var(--ok);background:var(--okbg)}

/* items */
.item{border:1px solid var(--line);border-left-width:6px;border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff}
.item.ok{border-left-color:var(--ok)}.item.off{border-left-color:var(--line)}.item.bad{border-left-color:var(--bad)}.item.warn{border-left-color:var(--warn)}
.item .top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.item .meta{font-size:13px;color:var(--muted);margin-top:2px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;background:#EDF0F4;color:var(--muted)}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.warn{background:var(--warnbg);color:var(--warn)}
code,.mono{font-family:var(--mono);font-size:12.5px}
.bar{height:8px;background:#E1E6EC;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--steel);transition:width .4s}

/* disks */
.disks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.disk{border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;background:#F7F9FB;font-size:13px}
.disk b{display:block;font-size:14px}
.disk.failed{background:var(--badbg);border-color:var(--bad)}
.disk.rebuilding{background:var(--warnbg);border-color:var(--warn)}
.disk .btns{justify-content:center;margin-top:6px}

/* terminal */
.term{background:var(--rack);color:#D6E2F2;border-radius:10px;padding:12px;font-family:var(--mono);font-size:12.5px;height:46vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
.term .p{color:#7FD6A8}.term .e{color:#F2A29B}
.tin{display:flex;gap:8px;margin-top:8px}.tin input{flex:1;font-family:var(--mono);font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{min-height:34px;font-size:12.5px;font-family:var(--mono);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Mini Data Center</h1>
  <p class="sub">Virtual machines, containers, RAID storage, backups and monitoring in one console. Everything here is simulated in your browser.</p>
</header>
<main id="view"></main>
<nav id="nav" aria-label="Sections"></nav>

<script>
(function(){
const enc = new TextEncoder();
const $ = id => document.getElementById(id);
const rnd = (a,b) => Math.floor(a + Math.random()*(b-a+1));
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
const fmt = d => d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
const ago = t => { const s = Math.round((Date.now()-t)/1000); return s < 60 ? s+" s ago" : Math.round(s/60)+" min ago"; };
function h(tag, a, ...kids){
  const e = document.createElement(tag); a = a || {};
  for (const k in a){
    if (k === "class") e.className = a[k];
    else if (k.slice(0,2) === "on") e[k] = a[k];
    else if (k === "disabled") e.disabled = !!a[k];
    else if (a[k] !== false && a[k] != null) e.setAttribute(k, a[k]);
  }
  kids.flat().forEach(x => { if (x == null || x === false) return; e.append(x.nodeType ? x : document.createTextNode(String(x))); });
  return e;
}
async function sha(s){
  if (window.crypto && crypto.subtle){
    const b = await crypto.subtle.digest("SHA-256", enc.encode(s));
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,"0")).join("");
  }
  let x = 2166136261; for (let i=0;i<s.length;i++){ x ^= s.charCodeAt(i); x = Math.imul(x,16777619); }
  return (x>>>0).toString(16).padStart(8,"0").repeat(8);
}

const RAID = {
  RAID0:{usable:4,tol:0,note:"Fastest. No protection: one failed disk loses everything."},
  RAID1:{usable:2,tol:1,note:"Mirrored pairs. Survives one failed disk."},
  RAID5:{usable:3,tol:1,note:"Balanced. Survives one failed disk."},
  RAID6:{usable:2,tol:2,note:"Safest. Survives two failed disks."}
};
const DISK_GB = 500;
const IMAGES = {nginx:80, postgres:5432, redis:6379, httpd:80, node:3000};

let S;
function freshVM(id,name,os,cpu,ram,data){
  return {id,name,os,cpu_n:cpu,ram_mb:ram,state:"running",cpu:10,ram:30,spike:0,snaps:[],data,wiped:false,hadData:Object.keys(data).length>0};
}
function init(){
  S = {
    tab:"status", t0:Date.now(), nextVm:3, nextCtr:3, nextBk:1, nextSnap:1,
    vms:[
      freshVM(1,"web-01","Ubuntu 22.04",2,2048,{"/var/www/index.html":"<h1>Welcome to the shop</h1>","/var/www/orders.csv":"1,Tea,2\n2,Coffee,1\n3,Biscuits,4"}),
      freshVM(2,"db-01","Debian 12",2,4096,{"/var/lib/db/customers.sql":"INSERT INTO customers VALUES (1,'Asha'),(2,'Jonas');","/etc/db.conf":"port=5432\nmax_connections=100"})
    ],
    ctrs:[
      {id:1,name:"nginx-1",image:"nginx",port:8080,vm:1,state:"running"},
      {id:2,name:"postgres-1",image:"postgres",port:5432,vm:2,state:"running"}
    ],
    raid:"RAID5", disks:[1,2,3,4].map(i => ({id:i,st:"ok",rb:0})), dead:false,
    backups:[], auto:false, autoIn:30, log:[], hist:[],
    term:["Mini Data Center shell. Type help to see commands."], termBusy:false
  };
  addLog("Data center online: 2 VMs, 2 containers, RAID5 pool.");
}
function addLog(msg, cls){ S.log.unshift({t:new Date(),msg,cls:cls||""}); if (S.log.length > 30) S.log.pop(); }

/* ---------------- model helpers ---------------- */
const vmById = id => S.vms.find(v => v.id === id);
const ctrUp = c => { const v = vmById(c.vm); return !!v && v.state === "running" && c.state === "running"; };
function pool(){
  const failed = S.disks.filter(d => d.st === "failed").length;
  const rebuilding = S.disks.some(d => d.st === "rebuilding");
  if (S.dead || failed > RAID[S.raid].tol) return "failed";
  if (failed || rebuilding) return "degraded";
  return "healthy";
}
function usedGB(){
  return Math.round(S.vms.reduce((a,v) => a + (v.state==="running"||v.hadData ? v.ram_mb/1024*3 + 4 : 0), 0));
}
function lastBackup(vmId){
  const b = S.backups.find(x => x.vmId === vmId);
  return b ? b.time.getTime() : 0;
}
function alerts(){
  const out = [];
  const p = pool();
  if (p === "failed") out.push(["bad","Storage pool failed. All VM data is gone. Replace the disks, then restore from backups."]);
  else if (p === "degraded") out.push(["warn","Storage is degraded. One more disk failure could lose data."]);
  S.vms.forEach(v => {
    if (v.state === "running" && v.cpu > 85) out.push(["warn", v.name + " CPU is at " + Math.round(v.cpu) + "%."]);
    if (v.wiped && !S.dead) out.push(["bad", v.name + " has lost its data. Restore it from a backup."]);
    if (v.state === "running" && !v.wiped && Object.keys(v.data).length && Date.now() - lastBackup(v.id) > 90000)
      out.push(["warn", v.name + " has no backup in the last 90 s (demo threshold)."]);
  });
  if (!out.length) out.push(["good","All systems normal."]);
  return out;
}

/* ---------------- actions ---------------- */
function startVm(v){
  if (S.dead){ addLog("Cannot start " + v.name + ": storage pool is offline.","e"); return render(); }
  v.state = "running"; addLog(v.name + " started."); render();
}
function stopVm(v){ v.state = "stopped"; v.cpu = 0; v.ram = 0; addLog(v.name + " stopped."); render(); }
function newVm(){
  if (S.dead){ addLog("Cannot create VM: storage pool is offline.","e"); return render(); }
  const id = S.nextVm++;
  S.vms.push(freshVM(id,"vm-0"+id,"Ubuntu 22.04",1,1024,{}));
  addLog("Created vm-0" + id + "."); render();
}
function delVm(v){
  S.vms = S.vms.filter(x => x !== v); S.ctrs = S.ctrs.filter(c => c.vm !== v.id);
  addLog("Deleted " + v.name + " and its containers.","e"); render();
}
function snapVm(v){
  if (v.snaps.length >= 3) v.snaps.pop();
  v.snaps.unshift({id:S.nextSnap++, time:new Date(), data:JSON.stringify(v.data)});
  addLog("Snapshot taken of " + v.name + "."); render();
}
function restoreSnap(v,s){
  v.data = JSON.parse(s.data); v.wiped = false;
  addLog("Reverted " + v.name + " to snapshot #" + s.id + ".","g"); render();
}
function wipeVm(v){
  v.data = {}; v.wiped = v.hadData; addLog("Disaster: all data on " + v.name + " deleted.","e"); render();
}
function stress(v){ v.spike = 8; addLog("Stress test started on " + v.name + ".","e"); render(); }

function runCtr(image, vmId, quiet){
  const v = vmById(vmId);
  if (!v || v.state !== "running"){ addLog("Cannot run container: host VM is not running.","e"); render(); return null; }
  const id = S.nextCtr++;
  const c = {id,name:image+"-"+id,image,port:IMAGES[image]+rnd(0,9)*(image==="nginx"||image==="httpd"?1000:0)||IMAGES[image],vm:vmId,state:"running"};
  S.ctrs.push(c); addLog("docker run " + image + " on " + v.name + " as " + c.name + "."); if (!quiet) render(); return c;
}
function ctrSet(c,state){ c.state = state; addLog("Container " + c.name + " " + (state === "running" ? "started" : "stopped") + "."); render(); }
function ctrRm(c){ S.ctrs = S.ctrs.filter(x => x !== c); addLog("Container " + c.name + " removed."); render(); }

function failDisk(d){
  if (d.st !== "ok") return;
  d.st = "failed"; addLog("Disk " + d.id + " failed.","e");
  checkDead(); render();
}
function replaceDisk(d){
  if (d.st !== "failed" || S.dead) return;
  d.st = "rebuilding"; d.rb = 0; addLog("Disk " + d.id + " replaced. Rebuilding...","g"); render();
}
function checkDead(){
  if (S.dead || S.disks.filter(d => d.st === "failed").length <= RAID[S.raid].tol) return;
  S.dead = true;
  S.vms.forEach(v => { v.state = "stopped"; v.cpu = 0; v.ram = 0; v.data = {}; v.wiped = v.hadData; v.snaps = []; });
  addLog("Pool failed: more disks lost than " + S.raid + " can survive. All VMs went down.","e");
}
function rebuildPool(){
  S.disks.forEach(d => { d.st = "ok"; d.rb = 0; }); S.dead = false;
  addLog("New disks installed. Pool is healthy but empty. Start the VMs and restore from backups.","g"); render();
}
function setRaid(l){ if (pool() !== "healthy") return; S.raid = l; addLog("Pool set to " + l + "."); render(); }

async function backupVm(v, quiet){
  if (S.dead){ addLog("Backup failed: storage pool offline.","e"); if (!quiet) render(); return null; }
  if (!Object.keys(v.data).length){ addLog("Skipped " + v.name + ": no data to back up.","e"); if (!quiet) render(); return null; }
  const snap = JSON.stringify(v.data), hash = await sha(snap);
  const b = {id:S.nextBk++, vmId:v.id, vmName:v.name, time:new Date(), snap, hash, n:Object.keys(v.data).length, check:"un"};
  S.backups.unshift(b); if (S.backups.length > 12) S.backups.pop();
  addLog("Backup #" + b.id + " of " + v.name + " saved (sha256 " + hash.slice(0,10) + "...).","g");
  if (!quiet) render(); return b;
}
async function backupAll(){
  const list = S.vms.filter(v => v.state === "running");
  for (const v of list) await backupVm(v, true);
  render();
}
async function verifyBk(b){
  b.check = (await sha(b.snap)) === b.hash ? "ok" : "bad";
  addLog("Verify #" + b.id + ": " + (b.check === "ok" ? "checksum matches" : "CHECKSUM MISMATCH"), b.check === "ok" ? "g" : "e");
  render(); return b.check === "ok";
}
async function restoreBk(b){
  const v = vmById(b.vmId);
  if (!v){ addLog("Restore failed: " + b.vmName + " no longer exists.","e"); return render(); }
  if (S.dead){ addLog("Restore failed: storage pool offline. Replace disks first.","e"); return render(); }
  if (!(await verifyBk(b))){ addLog("Restore #" + b.id + " refused: backup is corrupt. Try an older one.","e"); return render(); }
  v.data = JSON.parse(b.snap); v.wiped = false;
  addLog("Restored " + v.name + " from backup #" + b.id + ".","g"); render();
}
function corruptBk(b){ b.snap = b.snap.slice(0,-3) + "xx}"; b.check = "un"; addLog("Backup #" + b.id + " was corrupted (simulated disk error).","e"); render(); }

/* ---------------- live tick ---------------- */
function tick(){
  S.vms.forEach(v => {
    if (v.state !== "running"){ v.cpu = 0; v.ram = 0; return; }
    const n = S.ctrs.filter(c => c.vm === v.id && ctrUp(c)).length;
    const tc = 10 + 8*n + (v.spike > 0 ? 75 : 0), tr = 25 + 12*n + (v.ram_mb > 2048 ? 8 : 0);
    v.cpu = clamp(v.cpu + (tc - v.cpu)*0.35 + rnd(-4,4), 2, 99);
    v.ram = clamp(v.ram + (tr - v.ram)*0.2 + rnd(-2,2), 5, 95);
    if (v.spike > 0) v.spike--;
  });
  const run = S.vms.filter(v => v.state === "running");
  S.hist.push(run.length ? run.reduce((a,v) => a + v.cpu, 0)/run.length : 0);
  if (S.hist.length > 60) S.hist.shift();
  let changed = false;
  S.disks.forEach(d => { if (d.st === "rebuilding"){ d.rb += 7; if (d.rb >= 100){ d.st = "ok"; d.rb = 0; changed = true; addLog("Disk " + d.id + " rebuild complete.","g"); } } });
  if (S.auto && !S.dead){ S.autoIn--; if (S.autoIn <= 0){ S.autoIn = 30; backupAll(); addLog("Scheduled backup ran."); } }
  live(changed);
}
function live(rerender){
  if (S.tab === "status") return render();
  if (rerender) return render();
  document.querySelectorAll("[data-cpu]").forEach(e => { const v = vmById(+e.dataset.cpu); if (v) e.textContent = v.state === "running" ? Math.round(v.cpu) + "% CPU, " + Math.round(v.ram) + "% RAM" : "stopped"; });
  document.querySelectorAll("[data-rb]").forEach(e => { const d = S.disks.find(x => x.id === +e.dataset.rb); if (d) e.style.width = d.rb + "%"; });
  const ai = document.querySelector("[data-auto]"); if (ai) ai.textContent = S.auto ? "Next scheduled backup in " + S.autoIn + " s" : "";
}

/* ---------------- views ---------------- */
function viewStatus(){
  const p = pool(), run = S.vms.filter(v => v.state === "running").length, cr = S.ctrs.filter(ctrUp).length;
  const lb = S.backups[0];
  const root = h("div");
  root.append(h("div",{class:"tiles"},
    h("div",{class:"tile "+(run===S.vms.length?"ok":"warn")}, h("b",{},run+"/"+S.vms.length), h("span",{},"VMs running")),
    h("div",{class:"tile"}, h("b",{},cr+"/"+S.ctrs.length), h("span",{},"Containers up")),
    h("div",{class:"tile "+(p==="healthy"?"ok":p==="degraded"?"warn":"bad")}, h("b",{},p[0].toUpperCase()+p.slice(1)), h("span",{},S.raid+" storage")),
    h("div",{class:"tile "+(lb?"":"warn")}, h("b",{},lb ? ago(lb.time.getTime()) : "None"), h("span",{},"Last backup"))
  ));
  const rack = h("div",{class:"card"}, h("h2",{},"Server rack"));
  S.vms.forEach(v => {
    const led = v.state !== "running" ? "" : (v.wiped ? "bad" : v.cpu > 85 ? "warn" : "on");
    rack.append(h("div",{class:"unit"},
      h("span",{class:"led "+led}),
      h("div",{}, h("div",{class:"nm"},v.name), h("div",{class:"os"},v.os)),
      h("div",{class:"meter"}, h("div",{}, h("i",{style:"width:"+Math.round(v.cpu)+"%"}))),
      h("span",{class:"pct"}, v.state === "running" ? Math.round(v.cpu)+"%" : "off")
    ));
  });
  if (!S.vms.length) rack.append(h("p",{class:"hint"},"No VMs. Create one in the VMs tab."));
  root.append(rack);
  const W = 300, H = 70, pts = S.hist.map((y,i) => (i*(W/59)).toFixed(1)+","+(H - y/100*H).toFixed(1)).join(" ");
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","spark"); svg.setAttribute("viewBox","0 0 "+W+" "+H); svg.setAttribute("preserveAspectRatio","none");
  svg.innerHTML = '<line x1="0" y1="'+(H*0.15)+'" x2="'+W+'" y2="'+(H*0.15)+'" stroke="#E3B1AC" stroke-dasharray="4 4"/><polyline fill="none" stroke="#2B4C7E" stroke-width="2.5" points="'+pts+'"/>';
  root.append(h("div",{class:"card"}, h("h2",{},"Average CPU, last minute"), svg, h("p",{class:"hint"},"Dashed line is the 85% alert threshold.")));
  const al = h("div",{class:"card"}, h("h2",{},"Alerts"));
  alerts().forEach(([l,m]) => al.append(h("div",{class:"al "+l},m)));
  root.append(al);
  const lg = h("div",{class:"card"}, h("h2",{},"Activity"));
  S.log.slice(0,8).forEach(e => lg.append(h("div",{class:"mono",style:"padding:4px 0;border-bottom:1px solid #EDF0F4;color:"+(e.cls==="e"?"#B8322A":e.cls==="g"?"#1F7A55":"inherit")}, fmt(e.t)+"  "+e.msg)));
  root.append(lg);
  return root;
}

function viewVms(){
  const root = h("div");
  S.vms.forEach(v => {
    const st = v.state === "running" ? (v.wiped ? "bad" : "ok") : "off";
    const card = h("div",{class:"item "+st},
      h("div",{class:"top"}, h("span",{},v.name), h("span",{class:"tag "+(st==="ok"?"ok":st==="bad"?"bad":"")}, v.state === "running" ? (v.wiped ? "Data lost" : "Running") : "Stopped")),
      h("div",{class:"meta"}, v.os+" | "+v.cpu_n+" vCPU | "+(v.ram_mb/1024)+" GB RAM"),
      h("div",{class:"meta mono","data-cpu":v.id}, v.state === "running" ? Math.round(v.cpu)+"% CPU, "+Math.round(v.ram)+"% RAM" : "stopped"),
      h("div",{class:"meta"}, Object.keys(v.data).length+" files | "+v.snaps.length+" snapshots"),
      h("div",{class:"btns"},
        v.state === "running" ? h("button",{class:"alt sm",onclick:() => stopVm(v)},"Stop") : h("button",{class:"go sm",onclick:() => startVm(v)},"Start"),
        h("button",{class:"alt sm",disabled:S.dead,onclick:() => snapVm(v)},"Snapshot"),
        h("button",{class:"alt sm",disabled:v.state!=="running",onclick:() => stress(v)},"Stress CPU"),
        h("button",{class:"danger sm",onclick:() => wipeVm(v)},"Wipe data"),
        h("button",{class:"danger sm",onclick:() => delVm(v)},"Delete")
      )
    );
    if (v.snaps.length){
      const sn = h("div",{class:"btns"});
      v.snaps.forEach(s => sn.append(h("button",{class:"alt sm",onclick:() => restoreSnap(v,s)},"Revert to snapshot #"+s.id+" ("+fmt(s.time)+")")));
      card.append(sn);
    }
    const files = Object.keys(v.data);
    if (files.length) card.append(h("div",{class:"hint mono"}, files.join("\n")));
    root.append(card);
  });
  if (!S.vms.length) root.append(h("p",{class:"hint"},"No VMs yet."));
  root.append(h("button",{onclick:newVm,style:"width:100%"},"Create new VM"));
  root.append(h("p",{class:"hint"},"Snapshots live on the same disks as the VM, so they do not replace backups. Try: snapshot, wipe data, revert."));
  return root;
}

function viewDocker(){
  const root = h("div");
  const runVms = S.vms.filter(v => v.state === "running");
  const img = h("select",{"aria-label":"Image"}, Object.keys(IMAGES).map(i => h("option",{value:i},i)));
  const host = h("select",{"aria-label":"Host VM"}, runVms.map(v => h("option",{value:v.id},v.name)));
  root.append(h("div",{class:"card"}, h("h2",{},"Run a container"),
    h("div",{class:"form"}, img, host, h("button",{disabled:!runVms.length,onclick:() => runCtr(img.value,+host.value)},"Run")),
    runVms.length ? null : h("p",{class:"hint"},"Start a VM first. Containers need a running host.")));
  S.ctrs.forEach(c => {
    const v = vmById(c.vm), up = ctrUp(c);
    root.append(h("div",{class:"item "+(up?"ok":"off")},
      h("div",{class:"top"}, h("span",{},c.name), h("span",{class:"tag "+(up?"ok":"")}, up ? "Up" : (v && v.state!=="running" ? "Host down" : "Stopped"))),
      h("div",{class:"meta mono"}, "image "+c.image+" | port "+c.port+" | host "+(v ? v.name : "?")),
      h("div",{class:"btns"},
        c.state === "running" ? h("button",{class:"alt sm",onclick:() => ctrSet(c,"stopped")},"Stop") : h("button",{class:"go sm",onclick:() => ctrSet(c,"running")},"Start"),
        h("button",{class:"danger sm",onclick:() => ctrRm(c)},"Remove"))
    ));
  });
  if (!S.ctrs.length) root.append(h("p",{class:"hint"},"No containers. Run one above."));
  root.append(h("p",{class:"hint"},"Each running container adds CPU and RAM load to its host VM. Watch the Status tab."));
  return root;
}

function viewStorage(){
  const p = pool(), r = RAID[S.raid], root = h("div");
  const usable = r.usable*DISK_GB;
  root.append(h("div",{class:"card"}, h("h2",{},"Storage pool"),
    h("div",{class:"tiles",style:"margin-bottom:0"},
      h("div",{class:"tile "+(p==="healthy"?"ok":p==="degraded"?"warn":"bad")}, h("b",{},p[0].toUpperCase()+p.slice(1)), h("span",{},"Pool state")),
      h("div",{class:"tile"}, h("b",{},usable+" GB"), h("span",{},"Usable of "+(4*DISK_GB)+" GB"))
    ),
    h("div",{class:"bar"}, h("i",{style:"width:"+clamp(usedGB()/usable*100,0,100)+"%"})),
    h("p",{class:"hint"}, usedGB()+" GB used by VMs")
  ));
  const sel = h("div",{class:"btns"});
  Object.keys(RAID).forEach(l => sel.append(h("button",{class:(S.raid===l?"":"alt")+" sm",disabled:p!=="healthy",onclick:() => setRaid(l)},l)));
  root.append(h("div",{class:"card"}, h("h2",{},"RAID level"), sel,
    h("p",{class:"hint"}, r.note+" Tolerates "+r.tol+" failed disk"+(r.tol===1?"":"s")+". You can change level only while healthy.")));
  const dk = h("div",{class:"disks"});
  S.disks.forEach(d => {
    const el = h("div",{class:"disk "+d.st}, h("b",{},"Disk "+d.id), h("span",{}, d.st === "ok" ? "OK" : d.st === "failed" ? "Failed" : "Rebuilding"));
    if (d.st === "rebuilding") el.append(h("div",{class:"bar"}, h("i",{"data-rb":d.id,style:"width:"+d.rb+"%"})));
    el.append(h("div",{class:"btns"},
      d.st === "ok" ? h("button",{class:"danger sm",onclick:() => failDisk(d)},"Fail") : null,
      d.st === "failed" ? h("button",{class:"go sm",disabled:S.dead,onclick:() => replaceDisk(d)},"Replace") : null));
    dk.append(el);
  });
  const dc = h("div",{class:"card"}, h("h2",{},"Disks"), dk);
  if (S.dead) dc.append(h("div",{class:"al bad",style:"margin-top:10px"},"Too many disks failed for "+S.raid+". All VM data is lost."), h("button",{style:"width:100%",onclick:rebuildPool},"Install new disks and rebuild pool"));
  else dc.append(h("p",{class:"hint"},"Fail one disk, then replace it. With RAID5 the pool stays online while it rebuilds. Fail two and watch what happens."));
  root.append(dc);
  root.append(h("div",{class:"al"},"RAID protects against a disk dying. It does not protect against deleted files or ransomware. That is what backups are for."));
  return root;
}

function viewBackup(){
  const root = h("div");
  root.append(h("div",{class:"card"}, h("h2",{},"Backup jobs"),
    h("div",{class:"btns",style:"margin-top:0"},
      h("button",{class:"go",onclick:backupAll},"Back up all running VMs"),
      h("button",{class:S.auto?"":"alt",onclick:() => { S.auto = !S.auto; S.autoIn = 30; addLog("Scheduled backups " + (S.auto?"on (every 30 s for the demo)":"off") + "."); render(); }}, S.auto ? "Schedule: ON" : "Schedule: OFF")),
    h("p",{class:"hint mono","data-auto":1}, S.auto ? "Next scheduled backup in "+S.autoIn+" s" : ""),
    h("p",{class:"hint"},"Keeps the newest 12 backups. Each one stores a SHA-256 checksum that is checked before any restore.")));
  S.backups.forEach(b => {
    const cls = b.check === "ok" ? "ok" : b.check === "bad" ? "bad" : "off";
    root.append(h("div",{class:"item "+cls},
      h("div",{class:"top"}, h("span",{},"#"+b.id+" "+b.vmName), h("span",{class:"tag "+(cls==="off"?"":cls)}, b.check==="ok"?"Verified":b.check==="bad"?"Corrupt":"Not checked")),
      h("div",{class:"meta"}, fmt(b.time)+" | "+b.n+" files"),
      h("div",{class:"meta mono"}, "sha256 "+b.hash.slice(0,28)+"..."),
      h("div",{class:"btns"},
        h("button",{class:"alt sm",onclick:() => verifyBk(b)},"Verify"),
        h("button",{class:"sm",onclick:() => restoreBk(b)},"Restore"),
        h("button",{class:"danger sm",onclick:() => corruptBk(b)},"Corrupt it"))
    ));
  });
  if (!S.backups.length) root.append(h("p",{class:"hint"},"No backups yet. Tap Back up all running VMs."));
  root.append(h("p",{class:"hint"},"Full drill: back up, wipe a VM, restore it. Harder drill: fail too many disks, rebuild the pool, then restore every VM."));
  return root;
}

/* ---------------- terminal ---------------- */
function tprint(t){ S.term.push(...String(t).split("\n")); if (S.term.length > 200) S.term.splice(0, S.term.length-200); }
async function exec(line){
  const parts = line.trim().split(/\s+/), cmd = parts[0], a = parts.slice(1);
  tprint("$ " + line);
  if (!cmd) return;
  if (cmd === "clear"){ S.term = []; return; }
  if (cmd === "help") return tprint("vm list            list virtual machines\ndocker ps          list containers\ndocker run <image> run a container (nginx, redis, postgres, httpd, node)\ndocker stop <name> stop a container\ndf -h              storage usage\ncat /proc/mdstat   RAID status\nfree -m            memory by VM\nuptime             console uptime\nls /var/backups    list backups\nbackup now         back up all running VMs\ntail log           recent activity\nclear");
  if (cmd === "vm" && a[0] === "list") return tprint("NAME      STATE     CPU   RAM\n" + (S.vms.map(v => v.name.padEnd(9) + " " + v.state.padEnd(9) + " " + (Math.round(v.cpu)+"%").padEnd(5) + " " + Math.round(v.ram)+"%").join("\n") || "(none)"));
  if (cmd === "docker" && a[0] === "ps") return tprint("NAME          IMAGE      PORT   HOST\n" + (S.ctrs.filter(ctrUp).map(c => c.name.padEnd(13) + " " + c.image.padEnd(10) + " " + String(c.port).padEnd(6) + " " + vmById(c.vm).name).join("\n") || "(no running containers)"));
  if (cmd === "docker" && a[0] === "run"){
    if (!IMAGES[a[1]]) return tprint("Unable to find image '" + (a[1]||"") + "'. Try nginx, redis, postgres, httpd or node.","e");
    const v = S.vms.find(x => x.state === "running");
    if (!v) return tprint("No running VM to host the container.");
    const c = runCtr(a[1], v.id, true); return tprint("Started " + c.name + " on " + v.name + " (port " + c.port + ").");
  }
  if (cmd === "docker" && a[0] === "stop"){
    const c = S.ctrs.find(x => x.name === a[1]); if (!c) return tprint("No such container: " + (a[1]||""));
    c.state = "stopped"; addLog("Container " + c.name + " stopped."); return tprint(c.name);
  }
  if (cmd === "df") return tprint("Pool   " + S.raid + "   size " + RAID[S.raid].usable*DISK_GB + "G   used " + usedGB() + "G   state " + pool());
  if (cmd === "cat" && a[0] === "/proc/mdstat") return tprint("Personalities : [" + S.raid.toLowerCase() + "]\nmd0 : " + (pool()==="failed"?"inactive":"active "+S.raid.toLowerCase()) + " " + S.disks.map(d => "sd" + "abcd"[d.id-1] + (d.st==="ok"?"":"(F)")).join(" ") + "\n      [" + S.disks.map(d => d.st==="ok"?"U":"_").join("") + "] " + pool());
  if (cmd === "free") return tprint(S.vms.map(v => v.name.padEnd(9) + " " + (v.ram_mb) + "M total  " + Math.round(v.ram_mb*v.ram/100) + "M used").join("\n") || "(none)");
  if (cmd === "uptime") return tprint("up " + Math.round((Date.now()-S.t0)/1000) + " s, " + S.vms.filter(v => v.state==="running").length + " VMs running");
  if (cmd === "ls" && a[0] === "/var/backups") return tprint(S.backups.map(b => "backup-" + b.id + "-" + b.vmName + ".tar  " + b.hash.slice(0,8)).join("\n") || "(empty)");
  if (cmd === "backup" && a[0] === "now"){ await backupAll(); return tprint("Backups complete. See ls /var/backups."); }
  if (cmd === "tail" && a[0] === "log") return tprint(S.log.slice(0,6).reverse().map(e => fmt(e.t) + " " + e.msg).join("\n"));
  tprint("bash: " + cmd + ": command not found. Type help.");
}
function viewShell(){
  const root = h("div");
  const t = h("div",{class:"term",id:"termout",role:"log"}, S.term.join("\n"));
  const inp = h("input",{type:"text",id:"tin",placeholder:"Type a command, e.g. vm list",autocapitalize:"none",autocomplete:"off",spellcheck:"false","aria-label":"Command"});
  const go = async () => { const v = inp.value; inp.value = ""; await exec(v); render(true); };
  inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  root.append(t, h("div",{class:"tin"}, inp, h("button",{onclick:go},"Run")));
  const chips = h("div",{class:"chips"});
  ["help","vm list","docker ps","df -h","cat /proc/mdstat","backup now"].forEach(c => chips.append(h("button",{class:"alt",onclick:async () => { await exec(c); render(true); }},c)));
  root.append(chips);
  setTimeout(() => { t.scrollTop = t.scrollHeight; }, 0);
  return root;
}

/* ---------------- shell ---------------- */
const TABS = [["status","Status",viewStatus],["vms","VMs",viewVms],["docker","Docker",viewDocker],["storage","Storage",viewStorage],["backup","Backup",viewBackup],["shell","Shell",viewShell]];
function render(focusShell){
  const nav = $("nav"); nav.innerHTML = "";
  TABS.forEach(([id,label]) => nav.append(h("button",{"aria-current":S.tab===id?"true":"false",onclick:() => { S.tab = id; render(); window.scrollTo(0,0); }},label)));
  const view = $("view"), y = window.scrollY;
  const fn = TABS.find(t => t[0] === S.tab)[2];
  view.innerHTML = ""; view.append(fn());
  if (S.tab !== "shell") window.scrollTo(0,y);
  if (S.tab === "shell" && focusShell){ const i = $("tin"); if (i) i.focus({preventScroll:true}); }
}

init(); render();
setInterval(tick, 1000);
})();
</script>
